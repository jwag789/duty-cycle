# Fly.io config for the live demo. See "Deploy" in README.md.
# App names are global on Fly: if 'duty-cycle' is taken, `fly launch` picks another.
app = 'duty-cycle'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8787'

[http_service]
  internal_port = 8787
  force_https = true
  # Idle machines stop and start again on the next request. Rooms come back
  # from the database, so a cold start costs a few seconds, not the jam.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'

# Rooms are saved with PGlite on this volume unless DATABASE_URL is set.
# A volume belongs to one machine, which is what this app needs anyway:
# rooms live in one process's memory, so never scale past one instance.
[[mounts]]
  source = 'duty_cycle_data'
  destination = '/app/.data'
  initial_size = '1gb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
